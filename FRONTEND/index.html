<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YOLO Web App - PoC</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            text-align: center;
            background-color: #f4f4f9;
            color: #333;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: inline-block;
        }

        input, button {
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result-box {
            margin-top: 20px;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        video {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Nhận diện vật thể bằng YOLO</h2>

        <!--
            Cho phép chọn:
            JPG
            PNG
            MP4
        -->
        <input
            type="file"
            id="fileInput"
            accept="image/jpeg,image/png,video/mp4"
        >

        <br>

        <button onclick="uploadFile()">
            Nhận diện ngay
        </button>


        <div class="result-box">

            <h3>Kết quả:</h3>

            <!-- Kết quả ảnh -->
            <img
                id="resultImage"
                src=""
                alt="Chưa có kết quả"
                style="display:none;"
            >

            <!-- Kết quả video -->
            <video
                id="resultVideo"
                controls
                style="display:none;"
            >
            </video>

        </div>

    </div>


    <script>

        async function uploadFile() {

            const fileInput =
                document.getElementById('fileInput');

            const resultImage =
                document.getElementById('resultImage');

            const resultVideo =
                document.getElementById('resultVideo');


            // ==========================================
            // KIỂM TRA FILE
            // ==========================================

            if (fileInput.files.length === 0) {

                alert("Vui lòng chọn một file trước!");

                return;
            }


            const file = fileInput.files[0];


            // ==========================================
            // TẠO FORM DATA
            // ==========================================

            const formData = new FormData();

            formData.append("file", file);


            try {

                // Ẩn kết quả cũ
                resultImage.style.display = 'none';
                resultVideo.style.display = 'none';


                alert(
                    "Đang gửi file lên server, vui lòng đợi..."
                );


                // ==========================================
                // GỬI FILE ĐẾN FASTAPI
                // ==========================================

                const response = await fetch(
                    'http://127.0.0.1:8000/predict',
                    {
                        method: 'POST',
                        body: formData
                    }
                );


                // ==========================================
                // KIỂM TRA RESPONSE
                // ==========================================

                if (!response.ok) {

                    const errorData =
                        await response.json();

                    throw new Error(
                        errorData.detail ||
                        "Lỗi khi xử lý file ở server!"
                    );
                }


                // ==========================================
                // LẤY FILE KẾT QUẢ
                // ==========================================

                const rawBlob = await response.blob();
                const blob = file.type === "video/mp4" 
                    ? new Blob([rawBlob], { type: "video/mp4" }) 
                    : rawBlob;

                const objectURL =
                    URL.createObjectURL(blob);


                // ==========================================
                // ẢNH
                // ==========================================

                if (file.type.startsWith("image/")) {

                    resultImage.src = objectURL;

                    resultImage.style.display = 'block';
                }


                // ==========================================
                // VIDEO
                // ==========================================

                else if (file.type === "video/mp4") {

                    resultVideo.src = objectURL;

                    resultVideo.style.display = 'block';

                    resultVideo.load();
                }

            }

            catch (error) {

                console.error(error);

                alert(
                    "Có lỗi xảy ra: " +
                    error.message
                );
            }
        }

    </script>

</body>
</html>
